<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réception d'informations</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .champ { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>Envoyer vos informations</h2>
    <form action="https://formspree.io/f/mbgodbqg" method="POST">
        <div class="champ">
            <label for="nom">Nom complet :</label>
            <input type="text" id="nom" name="nom" required>
        </div>

        <div class="champ">
            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="champ">
            <label for="telephone">Numéro de téléphone :</label>
            <input type="tel" id="telephone" name="telephone" required>
        </div>

        <div class="champ">
            <label for="message">Informations complémentaires :</label>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <button type="submit">Envoyer</button>
    </form>

</body>
</html>
